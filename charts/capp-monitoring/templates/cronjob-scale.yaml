{{- if and .Values.enabled .Values.scale.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-benchmark-scale
  labels: {{ include "capp-monitoring.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scale.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {{ include "capp-monitoring.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Release.Name }}-benchmarks
          restartPolicy: OnFailure
          containers:
            - name: scale-test
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env: {{ include "capp-monitoring.envVars" . | nindent 16 }}
              command:
                - /bin/bash
                - /scripts/scale-test.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-benchmark-scripts
                defaultMode: 0755
{{- end }}
