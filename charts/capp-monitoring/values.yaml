# -- Enable the chart
enabled: true

image:
  # -- Image repository
  repository: ghcr.io/dana-team/capp-benchmark-runner
  # -- Image tag
  tag: "0.1.0"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- URL of the service to test (used when testCapp.enabled=false)
targetUrl: ""

# -- Capp name (used when testCapp.enabled=false)
cappName: ""
# -- Capp namespace (used when testCapp.enabled=false)
cappNamespace: capp-system

# -- Prometheus pushgateway URL for cold-start TTFB metric
pushgatewayUrl: ""

victoriametrics:
  # -- List of VictoriaMetrics base URLs for pushing synthetic metrics
  importUrls: []

# Test Capp
testCapp:
  # -- Deploy a chart-managed Capp for the scale benchmark
  enabled: true
  # -- Capp resource name
  name: capp-slo-test
  # -- Capp namespace (defaults to the release namespace)
  namespace: ""
  # -- Container image (delay-capable HTTP server for driving concurrency)
  image: mccutchen/go-httpbin:v2.15.0
  # -- Container port
  port: 8080
  # -- Container command override (empty = image default entrypoint)
  command: []
  # -- HTTP path the load test hits (/delay/N holds requests open for concurrency)
  loadPath: "/delay/0.5"
  # -- Autoscaling metric (fixed by cluster CappConfig, not settable per-Capp)
  metric: concurrency
  # -- Minimum replicas (0 = scale-to-zero for cold-start measurement)
  minReplicas: 0

# Scale benchmark
scale:
  # -- Enable the scale benchmark CronJob
  enabled: true
  # -- Cron schedule
  schedule: "15 * * * *"
  # -- Spawn an immediate one-shot Job on install/upgrade (in addition to the CronJob)
  oneshot: false
  # -- Target pod count for the time-to-scale milestone
  targetPods: 5
  # -- k6 virtual users (drives concurrency past the autoscaling target)
  loadVus: 100
  # -- Sustained load duration
  loadDuration: "3m"
  # -- Max seconds to wait for scale-out before marking the run failed
  timeoutSeconds: 180
  # -- Max seconds to wait for idle scale-to-zero before the cold-start check
  zeroWaitSeconds: 180

# Latency benchmark
latency:
  # -- Enable the latency benchmark CronJob
  enabled: false
  # -- Cron schedule
  schedule: "0 * * * *"
  testCapp:
    # -- Latency Capp resource name
    name: capp-latency-test

# iter8 benchmark
iter8:
  # -- Enable the iter8 benchmark CronJob
  enabled: false
  # -- Cron schedule
  schedule: "30 * * * *"

# On-demand benchmark
oneshot:
  # -- Enable the on-demand benchmark Job
  enabled: false
  # -- Benchmark type to run (k6-latency | k6-throughput | cold-start | iter8)
  type: ""
