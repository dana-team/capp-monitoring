# -- Status page sub-chart. Deploys Go status server.
status-page:
  enabled: true
  image:
    repository: ghcr.io/dana-team/capp-status-server
    tag: "0.1.0"
  namespaces:
    capp: capp-system
    knative: knative-serving
    certManager: cert-manager
    logging: logging-operator
    nfspvc: nfspvc-operator
    providerDns: provider-dns
  serviceMonitor:
    enabled: true

# -- Observability sub-chart. Deploys ServiceMonitors and Grafana ConfigMaps.
observability:
  enabled: true
  backend:
    namespace: capp-system
  operator:
    namespace: capp-system
  grafana:
    dashboard:
      enabled: true
    alerts:
      enabled: true
      datasourceUid: "prometheus"   # <-- set this to your Grafana Prometheus datasource UID

# -- Benchmarks sub-chart. Deploys k6 and iter8 CronJobs.
benchmarks:
  enabled: true
  image:
    repository: ghcr.io/dana-team/capp-benchmark-runner
    tag: "0.1.0"
  # targetUrl / knativeService are auto-derived from testCapp when testCapp.enabled=true.
  targetUrl: ""          # Override: e.g. http://my-app.capp-system.svc.cluster.local
  knativeService: ""     # Override: Knative service name for the scale/cold-start tests
  knativeNamespace: capp-system
  prometheus:
    remoteWriteUrl: ""   # Optional: VictoriaMetrics remote-write URL for k6 metrics (.../api/v1/write)
  pushgatewayUrl: ""     # Optional: Pushgateway URL (legacy cold-start path)
  victoriametrics:
    importUrl: ""        # VM base URL for synthetic scale metrics, e.g. http://vmsingle-...:8429
  # Test Capp – system-under-test, deployed in the release namespace.
  testCapp:
    enabled: true
    image: mccutchen/go-httpbin:v2.15.0  # delay-capable; mirror to your internal registry
  # Scale-behaviour benchmark thresholds/inputs.
  scale:
    enabled: true
    schedule: "*/15 * * * *"
    oneshot: false       # set true to run an immediate scale test (self-cleans)
    targetPods: 5
  job:
    enabled: false
