# CI: Test workflow
# Runs on every push and pull request. Performs Helm chart linting and
# Docker build validation. No cluster is required.
name: Test

on:
  push:
    branches: ["main"]
    paths:
      - "charts/**"
      - "docker/**"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  # ── Helm: lint ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Build chart dependencies
        run: helm dependency update charts/capp-monitoring

      - name: Lint chart
        run: |
          helm lint charts/capp-monitoring \
            --set benchmarks.targetUrl=http://example.com \
            --set benchmarks.cappName=test-svc

      - name: Template chart
        run: |
          helm template capp-monitoring charts/capp-monitoring \
            --set benchmarks.targetUrl=http://example.com \
            --set benchmarks.cappName=test-svc \
            > /dev/null

  # ── Docker: build check (no push) ────────────────────────────────────────────
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build benchmark-runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ghcr.io/dana-team/capp-benchmark-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
